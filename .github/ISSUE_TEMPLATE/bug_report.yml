name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search the [existing issues](https://github.com/bhagavan44/LogLens/issues) first.
        **Don't paste private data.** Logs often contain personal details, tokens or internal host names: remove them from any lines you share.
        Security problems go through [private reporting](https://github.com/bhagavan44/LogLens/security/advisories/new) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the log lines below
        2. Filter to Warning and above
        3. Search for ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample log lines
      description: A few lines that show the problem, with anything private removed. Mention the log format or output template if you know it.
      render: text
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Opening files
        - Parsing / log format
        - Event list
        - Detail pane
        - Filtering and search
        - Live tail
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LogLens version
      description: Shown in Help ▸ About, or in the exe's file name.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 (x64), Windows 10 22H2 ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Crash report or diagnostics log
      description: If LogLens crashed or showed an error, attach the newest file from `%LOCALAPPDATA%\LogLens\logs`.
      render: text
