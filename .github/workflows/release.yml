name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Reads the conventional commits since the last release and keeps a release PR open that bumps
  # the version in Directory.Build.props and updates CHANGELOG.md. Merging that PR tags the release
  # and publishes it on GitHub.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds the portable exe for the new release and attaches it to the GitHub release.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish single-file exe
        shell: pwsh
        run: ./build/publish.ps1 -Runtime ${{ matrix.runtime }}

      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} (Get-ChildItem artifacts/LogLens-*.exe).FullName --clobber
