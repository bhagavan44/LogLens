name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Reads the conventional commits since the last release and keeps a release PR open that bumps
  # the version in Directory.Build.props and updates CHANGELOG.md. Merging that PR tags the release
  # and publishes it on GitHub.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds the portable exe for the new release and attaches it to the GitHub release.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish single-file exe
        shell: pwsh
        run: ./build/publish.ps1 -Runtime ${{ matrix.runtime }}

      # No --clobber: winget pins each exe by SHA256, so a published exe must never be replaced.
      # A re-run fails here instead; ship a fix as a new version.
      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} (Get-ChildItem artifacts/LogLens-*.exe).FullName

  # Opens a pull request on microsoft/winget-pkgs for the new version. Needs a WINGET_TOKEN secret: a
  # personal access token with public_repo scope (GITHUB_TOKEN can't open PRs on another repo).
  # The package must already exist in winget-pkgs; the first version was submitted by hand.
  winget:
    needs: [release-please, publish]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Submit to winget
        shell: pwsh
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host '::warning::WINGET_TOKEN is not set; skipping the winget submission.'
            exit 0
          }
          $version = $env:TAG.TrimStart('v')
          $base = "https://github.com/bhagavan44/LogLens/releases/download/$env:TAG"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update bhagavan44.LogLens --version $version `
            --urls "$base/LogLens-$version-win-x64.exe|x64" "$base/LogLens-$version-win-arm64.exe|arm64" `
            --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate failed ($LASTEXITCODE)" }
