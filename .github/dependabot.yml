version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: '19:00'
      timezone: Asia/Kolkata
    assignees:
      - bhagavan44
    open-pull-requests-limit: 10
    groups:
      windows-app-sdk:
        patterns:
          - 'Microsoft.WindowsAppSDK'
          - 'Microsoft.Windows.SDK.BuildTools'
      microsoft-extensions:
        patterns:
          - 'Microsoft.Extensions.*'
      testing:
        patterns:
          - 'xunit*'
          - 'Microsoft.NET.Test.Sdk'
          - 'coverlet.*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: '19:00'
      timezone: Asia/Kolkata
    assignees:
      - bhagavan44
    groups:
      github-actions:
        patterns:
          - '*'
